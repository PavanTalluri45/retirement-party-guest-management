name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Test all backend services
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - retirement-party-auth-service
          - retirement-party-verification-service
          - retirement-party-analytics-service
          - retirement-party-registration-service
          - retirement-party-api-gateway
          - retirement-party-websocket-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies - ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Run tests - ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          npm test -- --passWithNoTests

  # Job 2: Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - retirement-party-auth-service
          - retirement-party-verification-service
          - retirement-party-analytics-service
          - retirement-party-registration-service
          - retirement-party-api-gateway
          - retirement-party-websocket-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push - ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:buildcache,mode=max

  # Job 3: Notify deployment (optional)
  notify:
    name: Notify Deployment Ready
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment notification
        run: |
          echo "CI/CD Pipeline completed successfully!"
          echo "Docker images built and pushed to GitHub Container Registry"
          echo "Ready for manual deployment to Render/Railway"
